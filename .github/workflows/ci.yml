name: ci

on:
  push:
  pull_request:

jobs:
  pure-python:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline checks
        run: python tools/test_pure.py

  pure-node:
    name: node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Offline checks
        run: node tools/test_pure.mjs

  # tools/check_ui.mjs is deliberately absent: it calls Yahoo Finance for a real
  # analysis, so it would be flaky here and could bill a model account. It is a
  # manual check against a locally running server (see README "Uji").
